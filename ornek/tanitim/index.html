<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url(jakarta.ttf)}
:root{--bg:#0c0c0e;--panel:#17171b;--line:#2a2a31;--ink:#f4f1ea;--muted:#8a8794;--acc:#ffb020;--acc2:#ff5a4f;--ok:#3ddc84;--blue:#6aa9ff;--mono:Menlo,ui-monospace,monospace}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:J,system-ui,sans-serif;color:var(--ink);position:relative}
.a{position:absolute}
.big{position:absolute;left:0;width:100%;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05}
.card{position:absolute;background:var(--panel);border:2px solid var(--line);border-radius:30px;box-shadow:0 30px 80px -30px #000}
.mono{font-family:var(--mono)}
.chip{display:inline-block;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:14px 32px;font-size:38px}
#cap{position:absolute;left:70px;right:70px;bottom:200px;text-align:center;font-size:52px;font-weight:800;line-height:1.3}
#cap span{display:inline-block;margin:0 6px}
</style></head><body><div id="bgl"></div><div id="root"></div><div id="hud"></div><div id="cap"></div>
<script>
const T={"s1": [0.59, 3.02], "s2": [3.02, 5.62], "s3": [5.62, 9.66], "s4": [9.66, 14.34], "s5": [14.34, 22.46], "s6": [22.46, 26.9], "s7": [26.9, 32.86], "s8": [32.86, 36.58], "s9": [36.58, 41.54], "s10": [41.54, 45.78], "s11": [45.85, 48.44], "s12": [48.66, 51.21], "end": 54.96}, W={"s1": [[0.59, 0.66, "Bu"], [0.66, 1.22, "videoyu"], [1.22, 1.7, "hiçbir"], [1.7, 2.1, "insan"], [2.1, 3.02, "kurgulamadı."]], "s2": [[3.02, 3.31, "Tek"], [3.31, 3.6, "bir"], [3.6, 4.16, "sayfa,"], [4.16, 4.47, "kare"], [4.47, 4.84, "kare"], [4.84, 5.62, "çekildi."]], "s3": [[5.62, 5.853, "Adı"], [5.853, 6.164, "Kare"], [6.164, 6.552, "Kare:"], [6.552, 7.018, "Claude"], [7.018, 7.329, "Code"], [7.329, 7.64, "için"], [7.64, 7.951, "açık"], [7.951, 8.417, "kaynak"], [8.417, 8.65, "bir"], [8.65, 9.038, "video"], [9.038, 9.66, "skill'i."]], "s4": [[9.66, 10.26, "Senaryoda"], [10.26, 11.11, "kısaltmaların"], [11.11, 11.56, "okunuşu"], [11.56, 11.79, "ayrı"], [11.79, 12.58, "yazılır,"], [12.58, 13.21, "ekrandaki"], [13.21, 13.59, "metin"], [13.59, 14.34, "bozulmaz."]], "s5": [[14.34, 14.739, "Ses"], [14.739, 16.07, "ElevenLabs"], [16.07, 16.47, "ile"], [16.47, 16.869, "tek"], [16.869, 17.535, "parça"], [17.535, 18.467, "okunur;"], [18.467, 19.531, "istersen"], [19.531, 20.596, "ücretsiz"], [20.596, 21.129, "Edge"], [21.129, 21.528, "TTS"], [21.528, 21.794, "de"], [21.794, 22.46, "olur."]], "s6": [[22.46, 22.98, "Whisper"], [22.98, 23.13, "her"], [23.13, 23.35, "kelimenin"], [23.35, 23.64, "zamanını"], [23.64, 23.93, "bulur;"], [23.93, 24.98, "yazılar"], [24.98, 25.3, "ve"], [25.3, 26.02, "altyazı"], [26.02, 26.34, "sese"], [26.34, 26.9, "kilitlenir."]], "s7": [[26.9, 27.332, "Ajan,"], [27.332, 28.196, "render'dan"], [28.196, 28.541, "önce"], [28.541, 29.146, "anahtar"], [29.146, 29.837, "karelere"], [29.837, 30.269, "bakar"], [30.269, 30.441, "ve"], [30.441, 30.873, "taşan"], [30.873, 31.392, "yazıyı"], [31.392, 32.169, "izlemeden"], [32.169, 32.86, "yakalar."]], "s8": [[32.86, 33.006, "On"], [33.006, 33.589, "tarayıcı"], [33.589, 34.173, "kareleri"], [34.173, 34.684, "paralel"], [34.684, 35.121, "çeker;"], [35.121, 35.486, "eksik"], [35.486, 35.778, "kare"], [35.778, 36.142, "varsa"], [36.142, 36.58, "durur."]], "s9": [[36.58, 36.972, "Son"], [36.972, 38.016, "kontrol:"], [38.016, 38.407, "ilk"], [38.407, 38.929, "kare"], [38.929, 39.452, "dolu"], [39.452, 39.843, "mu,"], [39.843, 40.235, "ses"], [40.235, 40.626, "−16"], [40.626, 41.148, "LUFS"], [41.148, 41.54, "mu?"]], "s10": [[41.54, 41.756, "Her"], [41.756, 42.043, "hata"], [42.043, 42.618, "tuzaklar"], [42.618, 43.265, "dosyasına"], [43.265, 43.84, "yazılır;"], [43.84, 44.055, "bir"], [44.055, 44.558, "sonraki"], [44.558, 44.918, "video"], [44.918, 45.205, "daha"], [45.205, 45.421, "iyi"], [45.421, 45.78, "olur."]], "s11": [[45.85, 45.95, "Şu"], [45.95, 46.06, "an"], [46.06, 46.47, "duyduğun"], [46.47, 46.63, "ses"], [46.63, 47.2, "ElevenLabs,"], [47.2, 47.61, "gördüğün"], [47.61, 47.77, "her"], [47.77, 47.97, "kare"], [47.97, 48.18, "Kare"], [48.18, 48.44, "Kare."]], "s12": [[48.66, 49.07, "Claude'a"], [49.07, 49.22, "bir"], [49.22, 49.58, "tanıtım"], [49.58, 49.93, "videosu"], [49.93, 50.09, "yap"], [50.09, 50.24, "de;"], [50.24, 50.65, "gerisini"], [50.65, 50.7, "o"], [50.7, 51.21, "halletsin."]]};
const FPS=30, NF=Math.floor(T.end*FPS);
const cl=x=>Math.min(Math.max(x,0),1), C=(a,b,t)=>cl((t-a)/(b-a)), E=x=>1-Math.pow(1-cl(x),3), L=(a,b,p)=>a+(b-a)*p;
const B=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const K=Object.keys(T).filter(k=>k!=='end');
const nx=k=>{const i=K.indexOf(k);return i<K.length-1?T[K[i+1]][0]:T.end+1};
// sahne görünürlüğü: giriş kelimeyle başlar, çıkış bir sonraki sahne başlamadan BİTER → üst üste binme yok
const vin=(k,d=0.45)=>E(C(T[k][0]-0.15,T[k][0]-0.15+d,t_));
const vout=k=>E(C(nx(k)-0.4,nx(k)-0.05,t_));
const on=k=>t_>=T[k][0]-0.2&&t_<nx(k);
const at=(k,i)=>W[k]&&W[k][i]?W[k][i][0]:T[k][0];
const pad=(n,l)=>String(n).padStart(l,'0');
const tc=t=>{t=Math.max(t,0);return pad(Math.floor(t/60),2)+':'+pad(Math.floor(t%60),2)+'.'+pad(Math.floor(t*FPS%FPS),2)};
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const check=(p,s=60,c='var(--ok)')=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56" style="flex:none"><circle cx="28" cy="28" r="28" fill="${c}" opacity="${cl(p*3)}"/><path d="M16 29l8 8 16-17" fill="none" stroke="#0c0c0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-E(C(0.3,1,p))}"/></svg>`;
const sq=(x,y,s,o,fill,extra='')=>`<div class="a" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:${s*0.12}px;background:${fill};opacity:${o};${extra}"></div>`;
const logo=(cx,cy,s,o)=>[2,1,0].map(i=>sq(cx-s/2+i*s*0.3,cy-s/2-i*s*0.18,s,o*(i?0.5-i*0.12:1),i?'var(--ink)':'var(--acc)')).join('');
let t_=0;

function render(t){
 t_=t; let h='', bg='';
 const sh=(t*90)%120;
 for(let i=-1;i<17;i++){const y=i*120+sh;
  bg+=`<div class="a" style="left:22px;top:${y}px;width:34px;height:62px;border-radius:5px;background:var(--ink);opacity:.14"></div><div class="a" style="left:1024px;top:${1920-y-62}px;width:34px;height:62px;border-radius:5px;background:var(--ink);opacity:.14"></div>`;}
 document.getElementById('bgl').innerHTML=bg;

 // S1 — kanca. Satırlar baştan soluk durur, kelime söylenince yanar → ilk kare dolu, düzen kaymaz
 if(t<nx('s1')){const out=vout('s1'); const ws=W.s1;
  [[0,1],[2,3],[4]].forEach((r,ri)=>{let line='';
   r.forEach(wi=>{const a=wi===0?0:ws[wi][0];const p=E(C(a-0.08,a+0.2,t));
    line+=`<span style="display:inline-block;margin:0 14px;opacity:${L(0.14,1,p)};transform:translateY(${(1-p)*24}px);color:${wi===4&&p>0.5?'var(--acc)':'var(--ink)'}">${ws[wi][2].replace('.','')}</span>`});
   h+=`<div class="big" style="top:${600+ri*170}px;font-size:${ri===2?150:136}px;opacity:${1-out};transform:translateY(${-out*140}px)">${line}</div>`;});
  h+=`<div class="a mono" style="left:0;width:100%;top:1170px;text-align:center;font-size:34px;color:var(--muted);opacity:${1-out}">editör yok · zaman çizelgesi yok</div>`;
 }

 // S2 — tek sayfa → ızgara; S3'e geçerken ızgara logoya toplanır (kesmeden geçiş #1)
 if(on('s2')||t<T.s3[0]+0.7&&t>=T.s2[0]-0.2){const p=vin('s2');
  const split=E(C(at('s2',3)-0.1,at('s2',3)+0.8,t));
  const gather=E(C(T.s3[0]-0.25,T.s3[0]+0.55,t));
  const N=15, cols=5, cw=L(760,150,split), chh=L(880,260,split);
  for(let i=0;i<N;i++){const cx=i%cols, cy=Math.floor(i/cols);
   let x=L(160,90+cx*186,split), y=L(420,560+cy*290,split);
   const d=i===0?1:E(C(at('s2',3)+i*0.025,at('s2',3)+i*0.025+0.5,t));
   x=i===0?x:L(160,x,d); y=i===0?y:L(420,y,d);
   const tx=L(x,540-110+(i%3)*0,gather), ty=L(y,640-110,gather), w=L(cw,220,gather), hh=L(chh,220,gather);
   const fill=gather>0.6?(i%3===0?'var(--acc)':'var(--ink)'):(i===0?'var(--panel)':`hsl(${36+R(i)*20} ${60+R(i+3)*30}% ${14+R(i+9)*10}%)`);
   const op=(i===0?1:d)*p*(1-E(C(T.s3[0]+0.2,T.s3[0]+0.6,t)));
   h+=`<div class="card" style="left:${tx}px;top:${ty}px;width:${w}px;height:${hh}px;opacity:${op};background:${fill};overflow:hidden;border-radius:${L(30,26,gather)}px">`+
    (i===0&&split<0.5?`<div class="mono" style="padding:44px;font-size:36px;line-height:1.6;color:var(--muted);opacity:${1-split*2}"><span style="color:var(--acc)">function</span> render(<span style="color:var(--ink)">t</span>){<br>&nbsp;&nbsp;<span style="color:var(--blue)">// her şey t'ye bağlı</span><br>&nbsp;&nbsp;baslik.y = E(C(1,2,t))<br>}<br><br><span style="color:var(--ink)">index.html#</span><span style="color:var(--acc)">${Math.max(t,0).toFixed(2)}</span></div>`:'')+
    (split>=0.5&&gather<0.4?`<div class="mono" style="position:absolute;left:14px;bottom:10px;font-size:22px;opacity:.7">#${pad(i*31,4)}</div><div style="position:absolute;left:24%;top:32%;width:52%;height:12px;border-radius:6px;background:var(--acc);opacity:.8"></div>`:'')+`</div>`;}
  h+=`<div class="big" style="top:230px;font-size:96px;opacity:${p*(1-gather)}">${split<0.5?'tek bir <span style="color:var(--acc)">sayfa</span>':'kare <span style="color:var(--acc)">kare</span>'}</div>`;
 }

 // S3 — logo + rozetler (yakınlaşma)
 if(t>=T.s3[0]+0.2&&t<nx('s3')){const p=E(C(T.s3[0]+0.2,T.s3[0]+0.8,t)), out=vout('s3');
  h+=logo(540,620,220,1-out);
  h+=`<div class="big" style="top:840px;font-size:170px;letter-spacing:-8px;opacity:${p*(1-out)};transform:scale(${L(1.08,1,p)*L(1,0.9,out)})">kare<span style="color:var(--acc)">-</span>kare</div>`;
  [['Claude Code skill',at('s3',4)],['açık kaynak · MIT',at('s3',7)],['codex · agy de okur',at('s3',10)]].forEach(([c,a],i)=>{const q=B(C(a-0.1,a+0.3,t));
   h+=`<div class="a mono" style="left:0;width:100%;top:${1090+i*96}px;text-align:center;opacity:${cl(q*2)*(1-out)};transform:translateY(${(1-q)*40}px)"><span class="chip" style="color:${i==0?'var(--acc)':'var(--ink)'}">${c}</span></div>`;});
 }

 // S4 — okunuş alanı (soldan kayma)
 if(on('s4')){const p=vin('s4'), out=vout('s4'), sx=(1-p)*-500;
  h+=`<div class="big" style="top:300px;font-size:92px;opacity:${p*(1-out)}">okunuş <span style="color:var(--acc)">ayrı</span></div>`;
  const rows=[['ekranda','Claude Code','var(--ink)',at('s4',3)],['seste','"Klod Kod"','var(--blue)',at('s4',5)]];
  rows.forEach(([k,v,c,a],i)=>{const q=E(C(a-0.15,a+0.35,t));
   h+=`<div class="card" style="left:${110+sx*(i?1.3:1)}px;top:${520+i*230}px;width:860px;height:190px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;opacity:${q*(1-out)}"><span class="mono" style="font-size:34px;color:var(--muted)">${k}</span><span style="font-size:68px;font-weight:800;color:${c}">${v}</span></div>`;});
  const q=E(C(at('s4',7)-0.1,at('s4',7)+0.4,t));
  h+=`<div class="a mono" style="left:0;width:100%;top:1020px;text-align:center;font-size:34px;color:var(--muted);opacity:${q*(1-out)}">lines.json → ["ekran metni", "duygu", "okunuş"]</div>`;
 }

 // S5 — TTS: dalga + iki seçenek (ölçek)
 if(on('s5')){const p=vin('s5'), out=vout('s5');
  let bars='';const prog=C(T.s5[0],T.s5[1],t);
  for(let i=0;i<44;i++){const hh=20+Math.abs(Math.sin(i*0.7+t*5)*Math.sin(i*0.23+1))*200;bars+=`<div style="width:12px;height:${hh}px;border-radius:6px;background:${i/44<prog?'var(--acc)':'#3a3a44'}"></div>`;}
  h+=`<div class="a" style="left:110px;width:860px;top:430px;height:280px;display:flex;align-items:center;justify-content:space-between;opacity:${p*(1-out)};transform:scaleY(${L(0.2,1,p)})">${bars}</div>`;
  h+=`<div class="a mono" style="left:0;width:100%;top:760px;text-align:center;font-size:34px;color:var(--muted);opacity:${p*(1-out)}">tüm senaryo · tek parça · doğal tonlama</div>`;
  [['ElevenLabs','kalite',at('s5',1),true],['Edge TTS','ücretsiz',at('s5',9),false]].forEach(([n,s,a,acc],i)=>{const q=B(C(a-0.1,a+0.35,t));
   h+=`<div class="card" style="left:${110+i*440}px;top:880px;width:420px;height:220px;padding:40px;opacity:${cl(q*2)*(1-out)};transform:scale(${L(0.7,1,q)});${acc?'border-color:var(--acc)':''}"><div class="mono" style="font-size:30px;color:var(--muted)">${s}</div><div style="font-size:58px;font-weight:800;margin-top:22px;color:${acc?'var(--acc)':'var(--ink)'}">${n}</div></div>`;});
 }

 // S6 — kelime zamanları (dikey kayan liste)
 if(on('s6')){const p=vin('s6'), out=vout('s6');
  const ws=W.s6; let cur=0; ws.forEach((w,i)=>{if(t>=w[0]-0.05)cur=i});
  const sc=cur+E(C(ws[cur][0]-0.05,ws[cur][0]+0.15,t))-1;
  h+=`<div class="big" style="top:300px;font-size:88px;opacity:${p*(1-out)}">sese <span style="color:var(--acc)">kilitli</span></div>`;
  ws.forEach(([a,b,w],i)=>{const y=780+(i-Math.max(sc,0))*118, act=i===cur;
   const o=cl(1-Math.abs(i-Math.max(sc,0))*0.3);
   h+=`<div class="a mono" style="left:150px;width:780px;top:${y}px;height:98px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-radius:22px;background:${act?'var(--acc)':'var(--panel)'};color:${act?'#0c0c0e':'var(--ink)'};font-size:42px;opacity:${(t>=a-0.05?1:0.3)*o*p*(1-out)}"><span style="font-family:J;font-weight:800">${w.replace(/[.,;]/g,'')}</span><span>${a.toFixed(2)} → ${b.toFixed(2)}</span></div>`;});
 }

 // S7 — anahtar kareler: taşan yazı yakalanır (silme geçişi)
 if(on('s7')){const p=vin('s7',0.6), out=vout('s7');
  h+=`<div style="position:absolute;inset:0;clip-path:inset(0 ${(1-p)*100}% 0 0)">`;
  h+=`<div class="big" style="top:300px;font-size:88px;opacity:${1-out}">anahtar <span style="color:var(--acc)">kareler</span></div>`;
  const bad=at('s7',7), fix=at('s7',9);
  for(let i=0;i<4;i++){const x=110+i*218, isBad=i===2;
   const flag=isBad?E(C(T.s7[0]+0.6,T.s7[0]+1,t)):0, ok=isBad?E(C(fix,fix+0.4,t)):0;
   h+=`<div class="card" style="left:${x}px;top:560px;width:200px;height:356px;overflow:visible;z-index:${isBad?2:1};opacity:${1-out};${flag&&!ok?'border-color:var(--acc2)':''}${ok?';border-color:var(--ok)':''}"><div class="mono" style="position:absolute;left:12px;top:10px;font-size:20px;color:var(--muted)">${[0,6.5,14,20][i]}s</div><div style="position:absolute;left:20px;top:140px;width:${isBad?L(300,150,ok):150}px;height:20px;border-radius:10px;background:${isBad&&ok<0.5?'var(--acc2)':'var(--acc)'}"></div><div style="position:absolute;left:20px;top:180px;width:110px;height:12px;border-radius:6px;background:var(--ink);opacity:.4"></div></div>`;
   if(isBad)h+=`<div class="a" style="left:${x+60}px;top:960px;opacity:${flag*(1-out)}">${ok>0.05?check(ok,80):`<svg width="80" height="80" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="var(--acc2)"/><path d="M28 14v18M28 40v2" stroke="#0c0c0e" stroke-width="6" stroke-linecap="round"/></svg>`}</div>`;}
  h+=`<div class="a mono" style="left:0;width:100%;top:1100px;text-align:center;font-size:34px;color:var(--muted);opacity:${1-out}">${t<fix?'3. kare: yazı taşıyor':'düzeltildi · render başlıyor'}</div></div>`;
 }

 // S8 — 10 tarayıcı paralel; eksik kare = dur (ızgara patlaması)
 if(on('s8')){const p=vin('s8'), out=vout('s8');
  const end=at('s8',6), fill=C(T.s8[0],end,t), cols=10, N=80, miss=57;
  const missOn=E(C(at('s8',6)-0.1,at('s8',6)+0.3,t));
  for(let i=0;i<N;i++){const lane=i%cols, row=Math.floor(i/cols);
   const done=row/8<fill*1.0+lane*0.004 && !(i===miss);
   const pop=done?B(C(T.s8[0]+(row/8)*(end-T.s8[0]),T.s8[0]+(row/8)*(end-T.s8[0])+0.3,t)):1;
   const red=i===miss&&missOn>0;
   h+=sq(110+lane*88,380+row*88,76,(done?1:red?1:0.16)*p*(1-out),red?'var(--acc2)':done?`hsl(${30+R(i)*20} 90% ${45+R(i+1)*15}%)`:'#3a3a44',`transform:scale(${done?L(0.4,1,pop):red?L(1,1.25,Math.sin(t*12)*0.5+0.5):1})`);}
  for(let l=0;l<cols;l++)h+=`<div class="a mono" style="left:${110+l*88}px;width:76px;top:330px;text-align:center;font-size:20px;color:var(--muted);opacity:${p*(1-out)}">${l+1}</div>`;
  h+=`<div class="a mono" style="left:110px;top:1110px;font-size:38px;color:${missOn>0.5?'var(--acc2)':'var(--muted)'};opacity:${p*(1-out)}">${missOn>0.5?'eksik kare #'+pad(miss*14,4)+' → render durdu':'10 tarayıcı · '+pad(Math.round(fill*NF),4)+'/'+NF+' kare'}</div>`;
 }

 // S9 — son kontrol listesi (sağdan kayma)
 if(on('s9')){const p=vin('s9'), out=vout('s9');
  h+=`<div class="big" style="top:300px;font-size:88px;opacity:${p*(1-out)};transform:translateX(${(1-p)*300}px)">check<span style="color:var(--acc)">.sh</span></div>`;
  [['ilk kare dolu mu','parlaklık 17',at('s9',3)],['ses −16 LUFS mu','−16,2',at('s9',7)],['süre · ses akışı','aac',at('s9',7)+0.35]].forEach(([k,v,a],i)=>{const q=E(C(a-0.3,a+0.2,t));
   h+=`<div class="card" style="left:110px;top:${540+i*190}px;width:860px;height:160px;display:flex;align-items:center;gap:30px;padding:0 40px;opacity:${q*(1-out)};transform:translateX(${(1-q)*300}px)">${check(C(a,a+0.6,t),64)}<span style="font-size:48px;font-weight:800;flex:1">${k}</span><span class="mono" style="font-size:32px;color:var(--muted)">${v}</span></div>`;});
 }

 // S10 — tuzaklar.md: satır yazılır (yazma efekti)
 if(on('s10')){const p=vin('s10'), out=vout('s10');
  const msg='- eksik kare videoyu kısaltır → önce say';
  const n=Math.floor(msg.length*C(at('s10',2),at('s10',6),t));
  h+=`<div class="card mono" style="left:110px;top:440px;width:860px;padding:40px;font-size:27px;line-height:1.7;opacity:${p*(1-out)};transform:translateY(${(1-p)*60}px)"><div style="color:var(--muted);font-size:26px;margin-bottom:16px">references/tuzaklar.md</div><div style="color:var(--muted)">- xargs 255 bayt sınırı → kare başına betik</div><div style="color:var(--muted)">- whisper ilk kelimeyi ezer → -ojf</div><div style="color:var(--acc)">${msg.slice(0,n)}${n<msg.length&&Math.floor(t*3)%2?'▍':''}</div></div>`;
  const q=B(C(at('s10',7)-0.1,at('s10',7)+0.4,t));
  h+=`<div class="big" style="top:1000px;font-size:84px;opacity:${cl(q*2)*(1-out)};transform:scale(${L(0.85,1,q)})">her video<br><span style="color:var(--acc)">bir öncekinden iyi</span></div>`;
 }

 // S11 — meta: dev kare sayacı (uzaklaşma)
 if(on('s11')){const p=vin('s11'), out=vout('s11');
  h+=`<div class="a mono" style="left:0;width:100%;top:420px;text-align:center;font-size:250px;font-weight:700;letter-spacing:-10px;color:var(--acc);opacity:${p*(1-out)};transform:scale(${L(1.5,1,p)})">${pad(Math.floor(t*FPS),4)}</div>`;
  h+=`<div class="a mono" style="left:0;width:100%;top:720px;text-align:center;font-size:36px;color:var(--muted);opacity:${p*(1-out)}">şu an izlediğin kare · ${NF} karenin biri</div>`;
  [['ses','ElevenLabs',at('s11',4)],['kareler','kare-kare',at('s11',5)]].forEach(([k,v,a],i)=>{const q=B(C(a-0.1,a+0.35,t));
   h+=`<div class="card" style="left:${110+i*440}px;top:880px;width:420px;height:230px;padding:38px;opacity:${cl(q*2)*(1-out)};transform:translateY(${(1-q)*80}px)"><div class="mono" style="font-size:30px;color:var(--muted)">${k}</div><div style="font-size:60px;font-weight:800;margin-top:24px;color:${i?'var(--acc)':'var(--ink)'}">${v}</div></div>`;});
 }

 // S12 — terminal istemi; kareler logoya toplanır (kesmeden geçiş #2)
 if(t>=T.s12[0]-0.2){const p=vin('s12');
  const msg='bir tanıtım videosu yap'; const n=Math.floor(msg.length*C(at('s12',1),at('s12',5),t));
  h+=`<div class="card mono" style="left:110px;top:480px;width:860px;padding:34px 40px;font-size:42px;opacity:${p};transform:translateY(${(1-p)*60}px)"><div style="display:flex;gap:12px;margin-bottom:26px">${['#ff5f57','#febc2e','#28c840'].map(c=>`<div style="width:22px;height:22px;border-radius:11px;background:${c}"></div>`).join('')}</div><span style="color:var(--acc)">&gt;</span> ${msg.slice(0,n)}<span style="color:var(--acc)">${Math.floor(t*2)%2?'▍':'&nbsp;'}</span></div>`;
  const g=E(C(at('s12',6),at('s12',6)+1.0,t));
  for(let i=0;i<12;i++){const sx=110+(i%6)*150, sy=760+Math.floor(i/6)*150;
   const tx=540-60+((i%3)-0)*0, ty=900-60;
   h+=sq(L(sx,tx+40,g),L(sy,ty+40,g),L(120,40,g),p*(1-E(C(0.3,0.9,g)))*E(C(T.s12[0]+i*0.05,T.s12[0]+i*0.05+0.4,t)),`hsl(${30+R(i)*20} 90% ${45+R(i+1)*15}%)`);}
  h+=logo(540,900,120,g);
  const q=E(C(at('s12',6)+0.4,at('s12',6)+1.2,t));
  h+=`<div class="big" style="top:1040px;font-size:150px;letter-spacing:-6px;opacity:${q};transform:scale(${L(1.2,1,q)})">kare<span style="color:var(--acc)">-</span>kare</div>`;
  h+=`<div class="a mono" style="left:0;width:100%;top:1240px;text-align:center;font-size:40px;color:var(--muted);opacity:${q}">github.com/eymenaktas/<span style="color:var(--ink)">kare-kare</span></div>`;
 }
 document.getElementById('root').innerHTML=h;

 const blink=(Math.floor(t*2)%2)===0;
 document.getElementById('hud').innerHTML=`<div class="a mono" style="left:90px;top:70px;font-size:30px;color:var(--muted);display:flex;align-items:center;gap:14px"><span style="width:18px;height:18px;border-radius:9px;background:var(--acc2);opacity:${blink?1:0.25}"></span>REC ${tc(t)}</div><div class="a mono" style="right:90px;top:70px;font-size:30px;color:var(--muted)">KARE ${pad(Math.floor(Math.max(t,0)*FPS),4)}/${NF}</div>`;

 // karaoke altyazı: kanca ve kapanışta kapalı (yazı zaten ekranda)
 let cap='';
 for(const s of K){const ws=W[s]; if(!ws||!ws.length||s==='s1'||s==='s12')continue;
  if(t<ws[0][0]-0.1||t>=nx(s)-0.05)continue;
  cap=ws.map(([x,y,w])=>`<span style="opacity:${t>=x?1:0.3};color:${t>=x&&t<y+0.05?'var(--acc)':'var(--ink)'}">${w}</span>`).join('');}
 document.getElementById('cap').innerHTML=cap;
}
render(parseFloat(location.hash.slice(1)||'0'));
</script></body></html>
