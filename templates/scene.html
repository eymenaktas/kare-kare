<!doctype html><html><head><meta charset="utf-8"><style>
/* MARKA: bu bloğu projenin font/renk token'larıyla değiştir */
:root{--bg:#faf8f5;--ink:#131519;--muted:#6b7280;--line:#eceef2;--accent:#f27625;--ok:#12a150;--font:system-ui,sans-serif}
/* @font-face{font-family:Brand;src:url(brand-800.ttf);font-weight:800} → --font:Brand */
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);position:relative}
.a{position:absolute}
.big{position:absolute;left:0;width:100%;text-align:center;font-weight:800;letter-spacing:-3px}
.card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 60px -20px rgb(19 21 25/25%);padding:30px 34px}
#cap{position:absolute;left:70px;right:70px;bottom:250px;text-align:center;font-size:58px;font-weight:800;line-height:1.25}
#cap span{display:inline-block;margin:0 8px}
</style></head><body><div id="root"></div><div id="cap"></div>
<script>
// T: {s1:[başla,bitir],...,end}  W: {s1:[[başla,bitir,kelime],...]}  → scripts/inject.py doldurur
const T=__T__, W=__W__;
const cl=x=>Math.min(Math.max(x,0),1), C=(a,b,t)=>cl((t-a)/(b-a)), E=x=>1-Math.pow(1-cl(x),3), L=(a,b,p)=>a+(b-a)*p;
const B=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
// kelimenin başladığı an (yoksa yedek değer)
const at=(k,i,fb)=>W[k]&&W[k][i]?W[k][i][0]:fb;
// çizilerek gelen tik: p 0→1
const check=(p,s=56,c='var(--ok)')=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="${c}" opacity="${cl(p*3)}"/><path d="M16 29l8 8 16-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-E(C(0.3,1,p))}"/></svg>`;

function render(t){
 let h='';
 const k=Object.keys(T).filter(x=>x!=='end');
 // --- SAHNE 1 (sorun): t<0'dan girmeye başlar → ilk kare dolu
 if(t<T[k[1]][0]+0.5){
  const out=E(C(T[k[1]][0],T[k[1]][0]+0.5,t));
  ['Görev bir','Görev iki','Görev üç'].forEach((n,i)=>{const p=B(C(-0.4+i*0.15,0.1+i*0.15,t));
   h+=`<div class="card" style="left:140px;top:${560+i*170}px;width:800px;display:flex;justify-content:space-between;align-items:center;font-size:44px;font-weight:700;opacity:${cl(p*2)*(1-out)};transform:translateX(${(1-p)*-80-out*300}px)"><span>${n}</span>${check(C(at(k[0],i*3,1+i),at(k[0],i*3,1+i)+0.5,t))}</div>`});
 }
 // --- SAHNE 2 (çözüm cümlesi): kinetik yazı, kelimeler seslendirmeyle gelir
 if(t>=T[k[1]][0]-0.2&&k[2]&&t<T[k[2]][0]+0.4){
  const out=E(C(T[k[2]][0],T[k[2]][0]+0.4,t));
  (W[k[1]]||[]).forEach(([a,,w],i)=>{const r=B(C(a-0.08,a+0.25,t));
   h+=`<div class="big" style="top:${700+i*150}px;font-size:140px;color:${i==W[k[1]].length-1?'var(--accent)':'var(--ink)'};opacity:${cl(r*2)*(1-out)};transform:translateY(${(1-r)*60}px) scale(${1-out*0.2})">${w}</div>`});
 }
 // --- KAPANIŞ: yakınlaşarak logo
 const last=k[k.length-1];
 if(t>=T[last][0]-0.1){const p=E(C(T[last][0],T[last][0]+0.8,t));
  h+=`<div class="big" style="top:760px;font-size:120px;opacity:${p};transform:scale(${L(1.4,1,p)})">Marka<span style="color:var(--accent)">.</span></div>`;}
 document.getElementById('root').innerHTML=h;
 // --- kelime kelime altyazı (büyük kinetik yazının olduğu satırlarda kapalı)
 let cap='';
 for(const s of k){const ws=W[s]; if(!ws||!ws.length||s===k[1]||s===last)continue;
  if(t<ws[0][0]-0.1||t>ws[ws.length-1][1]+0.35)continue;
  cap=ws.map(([x,y,w])=>`<span style="opacity:${t>=x?1:0.25};color:${t>=x&&t<y+0.05?'var(--accent)':'var(--ink)'}">${w}</span>`).join('');}
 document.getElementById('cap').innerHTML=cap;
}
render(parseFloat(location.hash.slice(1)||'0'));
</script></body></html>
